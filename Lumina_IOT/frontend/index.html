<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartPen</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eff4;
    --muted: #7c7c8a;
    --accent: #c8f560;
    --accent2: #4fffb0;
    --danger: #ff5f5f;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 280px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main"
      "footer footer";
  }

  /* HEADER */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .status-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface2);
    transition: all 0.3s;
  }

  .status-chip.online {
    color: var(--accent2);
    border-color: rgba(79,255,176,0.3);
    background: rgba(79,255,176,0.06);
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .dot.pulse {
    animation: pulse 1.4s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  /* SIDEBAR */
  aside {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow-y: auto;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Letter selector */
  .letter-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .letter-btn {
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .letter-btn:hover {
    border-color: var(--border2);
    color: var(--text);
    background: #252530;
  }

  .letter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d0d0f;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    width: 100%;
    padding: 11px 16px;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:hover { background: #252530; border-color: rgba(255,255,255,0.2); }
  .btn:active { transform: scale(0.98); }

  .btn.primary {
    background: var(--accent);
    color: #0d0d0f;
    border-color: transparent;
    font-weight: 600;
  }

  .btn.primary:hover { background: #d6ff70; }

  .btn.danger {
    border-color: rgba(255,95,95,0.35);
    color: var(--danger);
  }

  .btn.danger:hover { background: rgba(255,95,95,0.08); }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .stat-value.accent { color: var(--accent); }

  /* MAIN */
  main {
    grid-area: main;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    position: relative;
    overflow: hidden;
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 1;
  }

  /* Guide letter */
  .guide-letter {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 280px;
    font-weight: 700;
    color: rgba(255,255,255,0.03);
    pointer-events: none;
    user-select: none;
    line-height: 1;
    transition: opacity 0.3s;
  }

  canvas#drawCanvas {
    display: block;
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: crosshair;
  }

  canvas#drawCanvas.drawing {
    border-color: rgba(200,245,96,0.4);
    box-shadow: 0 0 0 1px rgba(200,245,96,0.15);
  }

  /* Score overlay */
  .score-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(13,13,15,0.85);
    border-radius: var(--radius);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    flex-direction: column;
    gap: 8px;
  }

  .score-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .score-number {
    font-family: var(--mono);
    font-size: 80px;
    font-weight: 700;
    line-height: 1;
  }

  .score-label {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Stroke indicator */
  .stroke-indicator {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .stroke-indicator.active {
    opacity: 1;
    color: var(--accent);
  }

  .stroke-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 0.8s infinite;
  }

  /* FOOTER */
  footer {
    grid-area: footer;
    padding: 10px 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-info {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }

  .log-strip {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    max-width: 400px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Score ring */
  .score-ring {
    width: 90px; height: 90px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .score-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }

  .score-ring-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    position: relative;
    z-index: 1;
  }

  /* Connection animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-in { animation: fadeIn 0.35s ease forwards; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d0d0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
      </svg>
    </div>
    SmartPen
  </div>

  <div class="status-bar">
    <div class="status-chip" id="wsStatus">
      <span class="dot pulse"></span>
      Connecting…
    </div>
    <div class="status-chip" id="espStatus">
      <span class="dot"></span>
      ESP32 Offline
    </div>
  </div>
</header>

<!-- SIDEBAR -->
<aside>
  <div>
    <div class="section-label">Target Letter</div>
    <div class="letter-grid" id="letterGrid"></div>
  </div>

  <div>
    <div class="section-label">Actions</div>
    <div class="controls">
      <button class="btn primary" id="btnReset">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.49"/></svg>
        Reset Canvas
      </button>
      <button class="btn" id="btnRecalibrate">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Recalibrate IMU
      </button>
      <button class="btn danger" id="btnClear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Clear Strokes
      </button>
    </div>
  </div>

  <div>
    <div class="section-label">Session Stats</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Strokes</div>
        <div class="stat-value accent" id="statStrokes">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Points</div>
        <div class="stat-value" id="statPoints">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Score</div>
        <div class="stat-value" id="statScore">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Letter</div>
        <div class="stat-value accent" id="statLetter">A</div>
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Last Score</div>
    <div style="display:flex; justify-content:center; padding:8px 0;">
      <div class="score-ring">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="38" stroke="rgba(255,255,255,0.07)" stroke-width="6" fill="none"/>
          <circle cx="45" cy="45" r="38" stroke="#c8f560" stroke-width="6" fill="none"
            stroke-dasharray="238.76"
            stroke-dashoffset="238.76"
            stroke-linecap="round"
            id="scoreArc"/>
        </svg>
        <span class="score-ring-value" id="scoreRingVal">—</span>
      </div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main>
  <div class="canvas-wrapper">
    <div class="guide-letter" id="guideLetter">A</div>
    <canvas id="drawCanvas" width="640" height="640"></canvas>
    <div class="stroke-indicator" id="strokeIndicator">
      <span class="stroke-dot"></span>
      Drawing
    </div>
    <div class="score-overlay" id="scoreOverlay">
      <div class="score-number" id="overlayScore">—</div>
      <div class="score-label">Score</div>
      <button class="btn primary" style="width:auto; padding:9px 24px; margin-top:8px;" id="btnDismiss">Next</button>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer>
  <span class="footer-info">SmartPen v3 · ESP32 + IMU</span>
  <span class="log-strip" id="logStrip">Waiting for connection…</span>
</footer>

<script>
const CANVAS_SIZE = 640;
const CANVAS_HALF = CANVAS_SIZE / 2;

const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

let ws = null;
let currentLetter = 'A';
let strokeCount = 0;
let pointCount = 0;
let lastScore = null;
let currentPath = [];
let allPaths = [];
let isDrawing = false;
let wsConnected = false;

// Letter grid
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const grid = document.getElementById('letterGrid');
LETTERS.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'letter-btn' + (l === 'A' ? ' active' : '');
  btn.textContent = l;
  btn.dataset.letter = l;
  btn.addEventListener('click', () => selectLetter(l));
  grid.appendChild(btn);
});

function selectLetter(l) {
  currentLetter = l;
  document.getElementById('guideLetter').textContent = l;
  document.getElementById('statLetter').textContent = l;
  grid.querySelectorAll('.letter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.letter === l);
  });
  if (ws && wsConnected) {
    ws.send(JSON.stringify({ type: 'set_letter', letter: l }));
  }
  log(`Target letter set to: ${l}`);
}

// Canvas render
function clearCanvas() {
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  renderAllPaths();
}

function renderAllPaths() {
  allPaths.forEach(path => drawPath(path, 'rgba(200,245,96,0.22)', 2.5));
  if (currentPath.length > 1) drawPath(currentPath, '#c8f560', 3.5);
}

function drawPath(path, color, width) {
  if (path.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.moveTo(path[0].x + CANVAS_HALF, path[0].y + CANVAS_HALF);
  for (let i = 1; i < path.length; i++) {
    ctx.lineTo(path[i].x + CANVAS_HALF, path[i].y + CANVAS_HALF);
  }
  ctx.stroke();
}

function addPoint(x, y) {
  currentPath.push({ x, y });
  pointCount++;
  document.getElementById('statPoints').textContent = pointCount;
  clearCanvas();
}

// WebSocket
function connectWS() {
  const url = `ws://${location.host}/ws/web`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    wsConnected = true;
    setWsStatus(true);
    log('WebSocket connected');
  };

  ws.onclose = () => {
    wsConnected = false;
    setWsStatus(false);
    log('WebSocket disconnected — retrying in 3s…');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    log('WebSocket error');
  };

  ws.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch { return; }
    handleMessage(msg);
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'stroke_start':
      isDrawing = true;
      currentPath = [];
      strokeCount++;
      document.getElementById('statStrokes').textContent = strokeCount;
      canvas.classList.add('drawing');
      document.getElementById('strokeIndicator').classList.add('active');
      log(`Stroke ${strokeCount} started`);
      break;

    case 'stroke_end':
      isDrawing = false;
      if (currentPath.length > 1) {
        allPaths.push([...currentPath]);
      }
      currentPath = [];
      canvas.classList.remove('drawing');
      document.getElementById('strokeIndicator').classList.remove('active');
      clearCanvas();
      log(`Stroke ended · ${strokeCount} total`);
      break;

    case 'point':
      if (isDrawing) addPoint(msg.x, msg.y);
      break;

    case 'reset':
      resetCanvas();
      break;

    case 'score':
      showScore(msg.value);
      break;

    case 'esp32_status':
      setEspStatus(msg.connected);
      break;
  }
}

function resetCanvas() {
  isDrawing = false;
  currentPath = [];
  allPaths = [];
  strokeCount = 0;
  pointCount = 0;
  document.getElementById('statStrokes').textContent = '0';
  document.getElementById('statPoints').textContent = '0';
  canvas.classList.remove('drawing');
  document.getElementById('strokeIndicator').classList.remove('active');
  clearCanvas();
  log('Canvas reset');
}

function showScore(val) {
  lastScore = val;
  const pct = Math.min(Math.max(val, 0), 100);
  document.getElementById('statScore').textContent = val;

  // Ring
  const circ = 238.76;
  const offset = circ - (pct / 100) * circ;
  document.getElementById('scoreArc').style.strokeDashoffset = offset;
  document.getElementById('scoreRingVal').textContent = val;

  // Color ring by score
  const color = pct >= 80 ? '#4fffb0' : pct >= 50 ? '#c8f560' : '#ff5f5f';
  document.getElementById('scoreArc').style.stroke = color;
  document.getElementById('scoreRingVal').style.color = color;

  // Overlay
  const overlay = document.getElementById('scoreOverlay');
  const overlayScore = document.getElementById('overlayScore');
  overlayScore.textContent = val;
  overlayScore.style.color = color;
  overlay.classList.add('visible');

  log(`Score received: ${val}`);
}

document.getElementById('btnDismiss').addEventListener('click', () => {
  document.getElementById('scoreOverlay').classList.remove('visible');
});

// Buttons
document.getElementById('btnReset').addEventListener('click', () => {
  if (ws && wsConnected) {
    ws.send(JSON.stringify({ type: 'reset' }));
  }
  resetCanvas();
});

document.getElementById('btnRecalibrate').addEventListener('click', () => {
  if (ws && wsConnected) {
    ws.send(JSON.stringify({ type: 'recalibrate' }));
    log('Recalibrate command sent to ESP32');
  } else {
    log('Not connected — cannot recalibrate');
  }
});

document.getElementById('btnClear').addEventListener('click', () => {
  allPaths = [];
  currentPath = [];
  clearCanvas();
  log('Strokes cleared');
});

// Status helpers
function setWsStatus(online) {
  const el = document.getElementById('wsStatus');
  el.className = 'status-chip' + (online ? ' online' : '');
  const dot = el.querySelector('.dot');
  dot.className = 'dot' + (online ? ' pulse' : '');
  el.childNodes[1] && (el.childNodes[1].textContent = '');
  el.querySelector('.dot').nextSibling && el.querySelector('.dot').after(
    document.createTextNode(online ? ' WebSocket Live' : ' WS Offline')
  );
  el.innerHTML = `<span class="dot${online?' pulse':''}"></span>${online ? 'WebSocket Live' : 'WS Offline'}`;
}

function setEspStatus(online) {
  const el = document.getElementById('espStatus');
  el.className = 'status-chip' + (online ? ' online' : '');
  el.innerHTML = `<span class="dot${online?' pulse':''}"></span>${online ? 'ESP32 Live' : 'ESP32 Offline'}`;
}

function log(msg) {
  document.getElementById('logStrip').textContent = `› ${msg}`;
}

// Init
connectWS();
clearCanvas();
</script>
</body>
</html>
